services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agentconnect
      POSTGRES_USER: agentconnect
      POSTGRES_PASSWORD: agentconnect
    ports:
      - "15432:5432"
    volumes:
      - agentconnect-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentconnect -d agentconnect"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://agentconnect:agentconnect@postgres:5432/agentconnect
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:15173,http://127.0.0.1:15173
    ports:
      - "18000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://agentconnect:agentconnect@postgres:5432/agentconnect
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:18000
    ports:
      - "15173:80"
    depends_on:
      - api

volumes:
  agentconnect-postgres:
